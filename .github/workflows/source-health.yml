name: Source health

# Upstream statistical APIs break quietly: dataflow keys get retired, datasets
# get discontinued after a classification revision, gateways start returning
# 502s. None of that is visible to the unit suite, which never touches the
# network. This probes the live sources on a schedule and raises a GitHub issue
# when one stops returning data, so the dataset cannot silently go stale.

on:
  schedule:
    # Mondays 06:00 UTC. Weekly is the right cadence: the sources publish on
    # monthly/quarterly cycles, so a daily run would mostly be noise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    # The World Bank fetcher paces its ~34 series a second apart and retries
    # with backoff, so a healthy run is ~6 minutes; this is a ceiling, not a
    # target.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Probe sources
        id: probe
        run: |
          set +e
          python scripts/check_sources.py | tee report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update an alert issue
        if: steps.probe.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf 'A scheduled source-health probe failed.\n\n```\n%s\n```\n\n[Run log](%s)\n' "$(cat report.txt)" "$RUN_URL")"
          existing="$(gh issue list --label source-health --state open --limit 1 --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "Source health check failing" \
              --label source-health \
              --body "$body"
          fi

      - name: Close the alert issue once sources recover
        if: steps.probe.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --label source-health --state open --limit 1 --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All enabled sources returned data again; closing."
          fi

      - name: Fail the run if any source is unhealthy
        if: steps.probe.outputs.exit_code != '0'
        run: exit 1
